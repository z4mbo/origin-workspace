services:
  companion:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    init: true
    restart: unless-stopped
    command: ["--origin", "${ORIGIN_AGENT_URL:?Set your Origin HTTPS address}"]
    environment:
      ORIGIN_AGENT_NAME: ${ORIGIN_AGENT_NAME:-Origin server}
    volumes:
      - ${ORIGIN_AGENT_HOME:?Set a private agent data directory}:/home/node/.origin-agent
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
